; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	milesburton/DallasTemperature@^4.0.6
	paulstoffregen/OneWire@^2.3.8
	kosme/arduinoFFT@^2.0.4

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^3.11.0
	knolleary/PubSubClient @ ^2.8
	bblanchon/ArduinoJson @ ^7.0.0
	kosme/arduinoFFT@^2.0.4
; Credenciais WiFi/MQTT via env vars do shell. Fallback p/ placeholders se
; vars nao setadas — compila mas nao conecta em rede real.
;
;   Windows PowerShell:
;     $env:WIFI_SSID = "RedeReal"; $env:WIFI_PASS = "..."; $env:MQTT_BROKER = "192.168.x.x"
;     pio run -e esp32
;
;   Linux/macOS:
;     WIFI_SSID=RedeReal WIFI_PASS=... MQTT_BROKER=192.168.x.x pio run -e esp32
build_flags =
	-DWIFI_SSID_BUILD=\"${sysenv.WIFI_SSID}\"
	-DWIFI_PASS_BUILD=\"${sysenv.WIFI_PASS}\"
	-DMQTT_BROKER_BUILD=\"${sysenv.MQTT_BROKER}\"
